    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Dashboard | Biome</title>
        
        <!-- Styles -->
        <link rel="stylesheet" href="css/dashboards.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
        
        <!-- Supabase SDK -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    </head> 
    <body>
        <div class="dashboard-layout">

            <!-- Sidebar -->
            <aside class="dashboard-sidebar">
                <div>
                    <div class="dashboard-brand">
                        <h2>Biome Admin</h2>
                        <p>Moderation Portal</p>
                    </div>
                    <nav class="sidebar-nav">
                        <button type="button" class="nav-btn active" data-view="pending">
                            <i class="fa-solid fa-clock"></i> Pending Reviews
                            <span class="badge" id="pendingBadge">0</span>
                        </button>
                        <button type="button" class="nav-btn" data-view="approved">
                            <i class="fa-solid fa-check-circle"></i> Published
                            <span class="badge" id="approvedBadge">0</span>
                        </button>
                        <button type="button" class="nav-btn" data-view="rejected">
                            <i class="fa-solid fa-times-circle"></i> Rejected
                            <span class="badge" id="rejectedBadge">0</span>
                        </button>
                        <button type="button" class="nav-btn" data-view="all">
                            <i class="fa-solid fa-list"></i> All Listings
                        </button>
                        <button type="button" class="nav-btn" data-view="users">
                            <i class="fa-solid fa-users"></i> Users
                        </button>
                    </nav>
                </div>
                <div class="sidebar-footer">
                    <div class="sidebar-user">
                        <span class="welcome">Logged in as</span>
                        <span class="name" id="adminName">Admin</span>
                    </div>
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-main">
                <!-- Header -->
                <header class="dashboard-header">
                    <div>
                        <h1 id="pageTitle">Pending Reviews</h1>
                        <p>Review and moderate property listings</p>
                    </div>
                    <div>
                        <button id="refreshBtn" class="btn btn-outline">
                            <i class="fa-solid fa-rotate"></i> Refresh
                        </button>
                    </div>
                </header>

                <!-- Metrics -->
                <section class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-value" id="totalCount">0</div>
                        <div class="metric-label">Total Listings</div>
                    </div>
                    <div class="metric-card pending">
                        <div class="metric-value" id="pendingCount">0</div>
                        <div class="metric-label">Pending</div>
                    </div>
                    <div class="metric-card approved">
                        <div class="metric-value" id="approvedCount">0</div>
                        <div class="metric-label">Published</div>
                    </div>
                    <div class="metric-card rejected">
                        <div class="metric-value" id="rejectedCount">0</div>
                        <div class="metric-label">Rejected</div>
                    </div>
                </section>

                <!-- Search & Filter -->
                <section class="dashboard-filters">
                    <div class="search-wrapper">
                        <input type="text" id="searchInput" placeholder="Search by title, seller or suburb..." />
                    </div>
                    <select id="statusFilter">
                        <option value="pending">Pending</option>
                        <option value="approved">Published</option>
                        <option value="rejected">Rejected</option>
                        <option value="all">All</option>
                    </select>
                </section>

                <!-- Listings Grid -->
                <section class="listings-section">
                    <div id="listingsContainer" class="listings-grid"></div>
                    <div id="emptyState" class="empty-state" style="display:none;">
                        <div class="empty-icon">📭</div>
                        <h3>No listings found</h3>
                        <p>There are no listings in this view.</p>
                    </div>
                </section>
            </main>
        </div>

        <!-- Detail Modal -->
        <div id="detailModal" class="biome-modal-overlay" style="display:none;">
            <div class="biome-modal">
                <div class="biome-modal-header">
                    <h2 id="modalTitle">Listing Details</h2>
                    <button class="biome-modal-close" id="modalCloseBtn">&times;</button>
                </div>
                <div class="biome-modal-body" id="modalBody"></div>
                <div class="biome-modal-footer">
                    <button id="modalClose" class="btn btn-outline">Close</button>
                </div>
            </div>
        </div>

        <!-- ===================================================== -->
        <!-- SCRIPTS - LOAD IN ORDER -->
        <!-- ===================================================== -->
        <script src="js/core/supabase.js"></script>
        <script src="js/core/utils.js"></script>
        <script src="js/core/ui.js"></script>
        <script src="js/core/auth.js"></script>
        <script src="js/core/storage.js"></script>
        
        <script src="js/services/listingService.js"></script>
        <script src="js/services/mediaService.js"></script>
        <script src="js/services/profileService.js"></script>
        <script src="js/services/propertyService.js"></script>
        
        <script src="js/components/navbar.js"></script>
        <script src="js/components/propertyCard.js"></script>
        <script src="js/components/toast.js"></script>
        
        <script src="js/pages/admin-dashboard.js"></script>
    </body>
    </html>
